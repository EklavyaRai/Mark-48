<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Comment</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <h2>Leave a Comment</h2>
  
  <form action="https://formspree.io/f/YOUR_FORMSPREE_ENDPOINT" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required placeholder="Your Name">

    <label for="email">Email:</label>
    <input type="email" id="email" name="_replyto" required placeholder="Your Email">

    <label for="comment">Comment:</label>
    <textarea id="comment" name="comment" rows="5" required placeholder="Write your comment here..."></textarea>

    <button type="submit">Submit Comment</button>
  </form>
</body>
</html>
